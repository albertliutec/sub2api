name: Docker Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ${{ secrets.OCI_REGISTRY }}
  REPOSITORY: ${{ secrets.OCI_REPOSITORY }}
  IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
  IMAGE: ${{ secrets.OCI_REGISTRY }}/${{ secrets.OCI_REPOSITORY }}:${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
  CONTAINER: sub2api
  DATA_DIR: /opt/sub2api/data

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Check SSH reachability
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -u
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_PORT:-}" ]; then
            echo "SSH_HOST or SSH_PORT secret is missing" >&2
            exit 1
          fi
          echo "probing ${SSH_HOST}:${SSH_PORT}"
          if timeout 15 bash -c "cat < /dev/null > /dev/tcp/${SSH_HOST}/${SSH_PORT}"; then
            echo "TCP reachable"
          else
            echo "TCP UNREACHABLE from GitHub runner" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Login to OCI registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OCI_USER }}
          password: ${{ secrets.OCI_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ env.IMAGE_TAG }}
            COMMIT=${{ github.sha }}

      - name: Encode config.yaml
        id: config
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          if [ -z "$CONFIG_YAML" ]; then
            echo "CONFIG_YAML secret is missing" >&2
            exit 1
          fi
          echo "value=$(printf '%s' "$CONFIG_YAML" | base64 -w 0)" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          CONFIG_YAML_B64: ${{ steps.config.outputs.value }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_PASSWORD: ${{ secrets.OCI_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASS }}
          port: ${{ secrets.SSH_PORT }}
          envs: CONFIG_YAML_B64,IMAGE,REGISTRY,OCI_USER,OCI_PASSWORD,CONTAINER,DATA_DIR
          script: |
            set -eu
            mkdir -p "$DATA_DIR"
            printf '%s' "$CONFIG_YAML_B64" | base64 -d > "$DATA_DIR/config.yaml"
            chmod 600 "$DATA_DIR/config.yaml"

            printf '%s' "$OCI_PASSWORD" | docker login "$REGISTRY" --username "$OCI_USER" --password-stdin
            trap 'docker logout "$REGISTRY" >/dev/null 2>&1 || true' EXIT

            docker pull "$IMAGE"
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 8080:8080 \
              -v "$DATA_DIR:/app/data" \
              "$IMAGE"

            for _ in $(seq 1 36); do
              if [ "$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo starting)" = "healthy" ]; then
                exit 0
              fi
              if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null)" != "true" ]; then
                break
              fi
              sleep 5
            done

            docker logs --tail 100 "$CONTAINER" || true
            exit 1

      - name: Write deployment summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Docker deployment: ${STATUS}"
            echo ""
            echo "- Image: \`${IMAGE}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
